[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120
src_paths = ["src", "tests"]

[tool.pytest.ini_options]
addopts = ["-q"]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true

[tool.bandit]
# The installer runs fixed tools (zenity, as, ld, convert, ...) with argument lists, never a shell.
skips = ["B404", "B603", "B607"]
