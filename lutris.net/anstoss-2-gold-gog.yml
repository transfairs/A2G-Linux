# Lutris installer for lutris.net: Anstoss 2 Gold, GOG release (setup_anstoss_2_gold_der_fuballmanager_1.0_fix2_(german)_(48434).exe).
# Unlike anstoss2.yml.in it needs no install.sh run before: it downloads this repository itself.
# For the website, everything below "script:" goes into the "Script" field (see README).
#
# The URL below always loads the newest release (asset A2G-Linux.tar.gz, published by .github/workflows/release.yml for each tag v*).
name: Anstoss 2 Gold (GOG)
# The game page on lutris.net (https://lutris.net/games/anstoss-2-gold-edition/), the same as for the CD and 2007 scripts
# Lutris offers the script in its GOG library only once lutris.net links GOG product 1808817480 to
# this page (as of November 2026 it is linked to anstoss-2, the game page of Anstoss 2 from 1997)
game_slug: anstoss-2-gold-edition
slug: anstoss-2-gold-edition-gog
version: GOG 1.0 fix2
runner: wine

script:
  # Lutris checks these before the installation starts. The steps with disable_runtime use the
  # system's programs, so Lutris must be a distribution package, not the Flatpak.
  require-binaries: python3, ffmpeg, ffprobe, gamescope, glib-compile-schemas, zenity, magick | convert

  files:
    # This repository (helper programs, patches, font builder), the newest release
    - a2gsrc:
        url: https://github.com/transfairs/A2G-Linux/releases/latest/download/A2G-Linux.tar.gz
        filename: a2g-linux.tar.gz
    # The GOG installer. Installed from Lutris' GOG source (logged in, game in the library), Lutris
    # downloads it via gogid; otherwise the user selects it. Lutris only picks GOG's German installer
    # when Lutris runs in German, else it falls back to "en", finds none and asks for the file.
    - goginstaller: 'N/A:Bitte den GOG-Installer auswählen'

  game:
    # 640x480 Wine virtual desktop (Proton ignores the registry setting for it), inside it
    # a2start.exe: switches to 640x480x16 and patches the game in memory (see README)
    exe: $GAMEDIR/drive_c/windows/explorer.exe
    working_dir: $GAMEDIR/drive_c/Spiele/Anstoss 2 Gold
    args: /desktop=A2,640x480 "C:/Spiele/Anstoss 2 Gold/a2start.exe" run.exe /f
    prefix: $GAMEDIR
    # GOG product ID of "Anstoss 2 Gold Edition", for the download of goginstaller
    gogid: 1808817480

  wine:
    # No version: Lutris then uses its default "GE-Proton (Latest)" (newest GE-Proton via umu);
    # install.sh pins GE-Proton11-12 instead. "version: ge-proton" fails in Lutris 0.5.22: installer
    # scripts get "-x86_64" appended (only names starting with "GE-Proton" are exempt), and
    # "ge-proton-x86_64" can be neither found nor downloaded.
    dxvk: false
    vkd3d: false
    overrides:
      ddraw: builtin
      dsound: builtin

  system:
    env:
      # GNOME 50: GTK3 inside Gamescope crashes (key "antialiasing" missing), hence a patched schema copy
      GSETTINGS_SCHEMA_DIR: $GAMEDIR/gschemas
      # gsfix.so (Gamescope only): keep clicks on the window frame away from the game, set the
      # window title and disable Proton's Gamescope hack that strips title bars from dialogs;
      # the app ID links the window to Lutris' menu entry (name and icon in the dock)
      LD_PRELOAD: $GAMEDIR/gsfix.so
      GSFIX_TITLE: Anstoss 2 Gold
      GSFIX_APPID: net.lutris.anstoss-2-gold-edition-[0-9]*
      GSFIX_WMNAME: gamescope
    gamescope: true
    gamescope_game_res: 640x480
    gamescope_output_res: 1280x960
    gamescope_window_mode: ""
    gamescope_flags: "-S fit -F pixel"

  installer:
    # Shell variables in commands are lowercase: Lutris replaces $GAMEDIR, $CACHE, $HOME, $a2gsrc,
    # $goginstaller etc. itself, also as the start of a longer name.
    - extract:
        file: a2gsrc
        dst: $CACHE/a2g
    # GitHub's archive has one top folder; Lutris usually unpacks its contents, this also covers the other case
    - execute:
        command: 'cd "$CACHE/a2g" && if [ ! -f install.sh ]; then d=$(dirname "$(find . -maxdepth 2 -name install.sh | head -1)") && cp -r "$d"/. . ; fi && test -f install.sh && test -f src/a2start.exe && test -f src/gsfix.so || { echo "The archive does not contain install.sh, src/a2start.exe and src/gsfix.so"; exit 1; }'

    - task:
        name: create_prefix
        prefix: $GAMEDIR

    # gschemas, gsfix.so (built by the release workflow) and the wide font (from the MS Sans Serif
    # of the Proton that umu fetched for the prefix) next to the game
    - execute:
        command: 'bash "$CACHE/a2g/install.sh" --make-schemas "$GAMEDIR/gschemas"'
        disable_runtime: true  # glib-compile-schemas with the system's libraries
    - execute:
        command: 'cp "$CACHE/a2g/src/gsfix.so" "$GAMEDIR/gsfix.so"'
    - execute:
        command: 'fonts=$(ls -d "$HOME"/.local/share/Steam/compatibilitytools.d/GE-Proton*/files/share/wine/fonts "$HOME"/.steam/root/compatibilitytools.d/GE-Proton*/files/share/wine/fonts "${XDG_DATA_HOME:-$HOME/.local/share}"/lutris/runners/wine/GE-Proton*/files/share/wine/fonts 2>/dev/null | sort -V | tail -1) && test -f "$fonts/sserife.fon" && python3 "$CACHE/a2g/src/a2assets.py" fonts "$fonts" "$CACHE/a2g/build" || { echo "No sserife.fon of GE-Proton found"; exit 1; }'
        disable_runtime: true

    # 96 DPI, no font smoothing
    - task:
        name: set_regedit
        prefix: $GAMEDIR
        path: HKEY_CURRENT_USER\Control Panel\Desktop
        key: LogPixels
        value: "00000060"
        type: REG_DWORD
    - task:
        name: set_regedit
        prefix: $GAMEDIR
        path: HKEY_CURRENT_USER\Control Panel\Desktop
        key: FontSmoothing
        value: "0"
        type: REG_SZ

    # Title bars in the colors of the XP theme Royale Noir (white on slate blue, inactive gray blue)
    - task:
        name: set_regedit
        prefix: $GAMEDIR
        path: HKEY_CURRENT_USER\Control Panel\Colors
        key: ActiveTitle
        value: "41 56 74"
        type: REG_SZ
    - task:
        name: set_regedit
        prefix: $GAMEDIR
        path: HKEY_CURRENT_USER\Control Panel\Colors
        key: GradientActiveTitle
        value: "58 70 86"
        type: REG_SZ
    - task:
        name: set_regedit
        prefix: $GAMEDIR
        path: HKEY_CURRENT_USER\Control Panel\Colors
        key: TitleText
        value: "255 255 255"
        type: REG_SZ
    - task:
        name: set_regedit
        prefix: $GAMEDIR
        path: HKEY_CURRENT_USER\Control Panel\Colors
        key: InactiveTitle
        value: "86 94 106"
        type: REG_SZ
    - task:
        name: set_regedit
        prefix: $GAMEDIR
        path: HKEY_CURRENT_USER\Control Panel\Colors
        key: GradientInactiveTitle
        value: "106 114 126"
        type: REG_SZ
    - task:
        name: set_regedit
        prefix: $GAMEDIR
        path: HKEY_CURRENT_USER\Control Panel\Colors
        key: InactiveTitleText
        value: "196 200 208"
        type: REG_SZ
    # Background of the virtual desktop in the active title bar color
    - task:
        name: set_regedit
        prefix: $GAMEDIR
        path: HKEY_CURRENT_USER\Control Panel\Colors
        key: Background
        value: "41 56 74"
        type: REG_SZ

    # Bold title bar font as in Royale Noir (LOGFONTW: Tahoma, height 10, weight 700)
    - task:
        name: set_regedit
        prefix: $GAMEDIR
        path: HKEY_CURRENT_USER\Control Panel\Desktop\WindowMetrics
        key: CaptionFont
        value: "0a 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 bc 02 00 00 00 00 00 01 00 00 00 00 54 00 61 00 68 00 6f 00 6d 00 61 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00"
        type: REG_BINARY

    # DirectDraw via GDI instead of OpenGL (video windows get painted over otherwise)
    - task:
        name: set_regedit
        prefix: $GAMEDIR
        path: HKEY_CURRENT_USER\Software\Wine\Direct3D
        key: renderer
        value: gdi
        type: REG_SZ

    # Without this, input stopped arriving after clicking another window
    - task:
        name: set_regedit
        prefix: $GAMEDIR
        path: HKEY_CURRENT_USER\Software\Wine\X11 Driver
        key: UseTakeFocus
        value: "N"
        type: REG_SZ

    # GOG installer: unpacked with innoextract instead of running it. GOG ships the 2007 CD release
    # (run.exe, unpacked from its copy protection) plus its own additions; only the game itself goes
    # to C:\Spiele\Anstoss 2 Gold. Left out or removed: DirectX, GOG's DirectDraw wrapper ddraw.dll
    # (Gamescope scales the game here), the compatibility database game.sdb, the goggame-* files
    # and the installer's own files. Kept: rest.sav (GOG puts it under __support/save; without it a
    # new game crashes) and ExSpiel.sav (app/DATA.DEF, app/DATA.VER).
    # Lutris' own innoextract (static build) first, then the system's.
    - execute:
        command: 'inno=$(ls "${XDG_DATA_HOME:-$HOME/.local/share}"/lutris/runtime/innoextract*/innoextract 2>/dev/null | head -1); inno=${inno:-$(command -v innoextract)}; test -n "$inno" || { echo "innoextract is missing, please install it with your package manager"; exit 1; }; mkdir -p "$GAMEDIR/drive_c/Spiele/Anstoss 2 Gold" && "$inno" -s -m -g -d "$GAMEDIR/drive_c/Spiele/Anstoss 2 Gold" "$goginstaller" && cd "$GAMEDIR/drive_c/Spiele/Anstoss 2 Gold" && cp __support/save/* . && cp -r app/DATA.DEF app/DATA.VER . && rm -rf __redist __support app commonappdata ddraw.dll game.sdb goggame-* && test -f run.exe && test -f rest.sav || { echo "Unpacking the GOG installer failed"; exit 1; }'
        disable_runtime: true  # a system innoextract needs the system's libraries

    # Banner and cover from GOG's images of the game, icon Anstoss2.ico from the installer, as
    # install.sh does: lutris.net has no icon for anstoss-2-gold-edition, and its banner and cover
    # show other art. Lutris names these files after the game slug and downloads only missing ones, so
    # it keeps them.
    - execute:
        command: 'd="${XDG_DATA_HOME:-$HOME/.local/share}" && python3 "$CACHE/a2g/src/a2assets.py" media-gog 1808817480 "$d/lutris/banners/anstoss-2-gold-edition.jpg" "$d/lutris/coverart/anstoss-2-gold-edition.jpg" && mkdir -p "$d/icons/hicolor/128x128/apps" && im=$(command -v magick || command -v convert) && "$im" "$GAMEDIR/drive_c/Spiele/Anstoss 2 Gold/Anstoss2.ico" -filter point -resize 128x128 "PNG32:$d/icons/hicolor/128x128/apps/lutris_anstoss-2-gold-edition.png"'
        disable_runtime: true  # ImageMagick with the system's libraries

    # What the GOG installer writes to the registry; the game reads its folder from InstalledTo
    # (32-bit program, hence Wow6432Node)
    - task:
        name: set_regedit
        prefix: $GAMEDIR
        path: HKEY_LOCAL_MACHINE\Software\Wow6432Node\ASCARON\ANSTOSS 2\1.00
        key: InstalledTo
        value: 'C:\\Spiele\\Anstoss 2 Gold'
        type: REG_SZ
    - task:
        name: set_regedit
        prefix: $GAMEDIR
        path: HKEY_LOCAL_MACHINE\Software\Wow6432Node\ASCARON\ANSTOSS 2\1.00
        key: InstalledFrom
        value: 'C:\\Spiele\\Anstoss 2 Gold'
        type: REG_SZ
    - task:
        name: set_regedit
        prefix: $GAMEDIR
        path: HKEY_LOCAL_MACHINE\Software\Wow6432Node\ASCARON\ANSTOSS 2\1.00
        key: Language
        value: DEU
        type: REG_SZ

    - execute:
        command: 'cp "$CACHE/a2g/src/a2start.exe" "$CACHE"/a2g/build/a2wide2?.fnt "$GAMEDIR/drive_c/Spiele/Anstoss 2 Gold/"'

    # Sound on the default audio device instead of the last one found (patch from A2G-Patch); let the
    # CD checks of the 2007 release pass (--disc-check) and add the program changes of patch 1.01
    # (--v101, src/a2v101.S), see README
    - execute:
        command: 'python3 "$CACHE/a2g/src/a2patch.py" --sound --disc-check --v101 "$GAMEDIR/drive_c/Spiele/Anstoss 2 Gold/run.exe"'
        disable_runtime: true  # as/ld (--v101) with the system's libraries

    # Indeo videos in the game folder
    - execute:
        command: 'bash "$CACHE/a2g/install.sh" --convert-only "$GAMEDIR/drive_c/Spiele/Anstoss 2 Gold"'
        disable_runtime: true  # ffmpeg/ffprobe do not start with Lutris' runtime libraries

    # Data of patch 1.01: event texts, LAENDER.SAV, MoveList.dat (src/a2data101.py, src/a2movelist.py)
    - execute:
        command: 'python3 "$CACHE/a2g/src/a2data101.py" "$GAMEDIR/drive_c/Spiele/Anstoss 2 Gold"'
        disable_runtime: true

    # Dialogs as in 1999: title bars, frames of the choices etc. in RESDLL.dll (src/a2resdll.py)
    - execute:
        command: 'python3 "$CACHE/a2g/src/a2resdll.py" "$GAMEDIR/drive_c/Spiele/Anstoss 2 Gold"'
        disable_runtime: true

    # Optional: data set (overwrites the game's files) and save games (existing ones are kept)
    - input_menu:
        description: 'Einen Anstoss-2-Datensatz in den Spielordner importieren?'
        id: DATASET
        options:
          - none: Nicht importieren
          - zip: Aus einer Zip-Datei
          - dir: Aus einem Ordner
        preselect: none
    - execute:
        command: 'python3 "$CACHE/a2g/src/a2import.py" --overwrite --title "Anstoss-2-Datensatz" "$INPUT_DATASET" "$GAMEDIR/drive_c/Spiele/Anstoss 2 Gold"'
        disable_runtime: true  # zenity does not start with Lutris' runtime libraries

    - input_menu:
        description: 'Spielstände in den Spielordner importieren?'
        id: SAVES
        options:
          - none: Nicht importieren
          - dir: Aus einem Ordner
          - zip: Aus einer Zip-Datei
        preselect: none
    - execute:
        command: 'python3 "$CACHE/a2g/src/a2import.py" --title "Anstoss-2-Spielstände" "$INPUT_SAVES" "$GAMEDIR/drive_c/Spiele/Anstoss 2 Gold"'
        disable_runtime: true  # zenity does not start with Lutris' runtime libraries

    # Optional: lift the goal limits (patch "Torgrenzen aufheben" from A2G-Patch, see README)
    - input_menu:
        description: 'Torgrenzen aufheben? Ohne Patch trifft eine Mannschaft vor der Halbzeit höchstens 6-mal und danach höchstens 10-mal, ab 7 Toren halbieren sich ihre Chancen. Der Patch hebt die Grenze auf 15 an.'
        id: GOALS
        options:
          - 'no': Original beibehalten
          - 'yes': Torgrenzen aufheben
        preselect: 'no'
    - execute:
        command: 'test "$INPUT_GOALS" != yes || python3 "$CACHE/a2g/src/a2patch.py" --goals "$GAMEDIR/drive_c/Spiele/Anstoss 2 Gold/run.exe"'
        disable_runtime: true

    # Editor and, optionally, A2G-Trainer: entries in the application menu, started in this prefix
    # (src/a2run.sh). Not a Lutris file, since those cannot be optional. Own slug anstoss-2-gog for their
    # files, so they never replace the entries of an install.sh installation (anstoss-2-gold-gog).
    - input_menu:
        description: 'A2G-Trainer installieren? Er bearbeitet das laufende Spiel (Spieler, Vereine, Finanzen) und bekommt einen eigenen Eintrag im Anwendungsmenü.'
        id: TRAINER
        options:
          - none: Nicht installieren
          - download: Neueste Version von GitHub herunterladen
          - file: Aus einer lokalen Datei (zip oder exe)
        preselect: none
    - execute:
        command: 'python3 "$CACHE/a2g/src/a2extras.py" --slug anstoss-2-gog "$GAMEDIR" "$INPUT_TRAINER"'
        disable_runtime: true  # system tools (ImageMagick) with the system's libraries
