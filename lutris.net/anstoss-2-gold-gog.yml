# Lutris installer for lutris.net: Anstoss 2 Gold, GOG release (setup_anstoss_2_gold_der_fuballmanager_1.0_fix2_(german)_(48434).exe).
# Unlike anstoss2.yml.in it needs no install.sh run before: it downloads this repository itself.
# It runs in Lutris' Flatpak as well: Lutris' own steps only, nothing of the system's programs and
# nothing written to the home folder. The work Lutris can't do runs as a Windows program in the
# prefix, src/a2patcher.exe (see there). install.sh does more (icon, banner, data set, save games,
# trainer, editor) with the system's programs.
# On lutris.net, the script is everything below "script:", one indentation level less (lutris.net/content.sh).
#
# The URL below always loads the newest release (asset A2G-Linux.tar.gz, published by .github/workflows/release.yml for each tag v*).
name: Anstoss 2 Gold (GOG)
# The game page on lutris.net (https://lutris.net/games/anstoss-2-gold-edition/), the same as for the CD and 2007 scripts
# Lutris offers the script in its GOG library if lutris.net links GOG product 1808817480 to this page
game_slug: anstoss-2-gold-edition
slug: anstoss-2-gold-edition-gog
version: GOG 1.0 fix2
runner: wine

script:
  files:
    # This repository (helper programs, patches), the newest release; with src/a2patcher.exe,
    # src/ffmpeg.exe and src/gsfix.so, built by the release workflow
    - a2gsrc:
        url: https://github.com/transfairs/A2G-Linux/releases/latest/download/A2G-Linux.tar.gz
        filename: a2g-linux.tar.gz
    # The GOG installer. Installed from Lutris' GOG source (logged in, game in the library), Lutris
    # downloads it via gogid; otherwise the user selects it. Lutris only picks GOG's German installer
    # when Lutris runs in German, else it falls back to "en", finds none and asks for the file.
    - goginstaller: 'N/A:Bitte den GOG-Installer auswählen'

  game:
    # 640x480 Wine virtual desktop (Proton ignores the registry setting for it), inside it
    # a2start.exe: switches to 640x480x16 and patches the game in memory (see README)
    exe: $GAMEDIR/drive_c/windows/explorer.exe
    working_dir: $GAMEDIR/drive_c/Spiele/Anstoss 2 Gold
    args: /desktop=A2,640x480 "C:/Spiele/Anstoss 2 Gold/a2start.exe" run.exe /f
    prefix: $GAMEDIR
    # GOG product ID of "Anstoss 2 Gold Edition", for the download of goginstaller
    gogid: 1808817480

  wine:
    # Wine Staging (lutris.net's "wine-staging", Lutris adds "-x86_64"), not Proton: Lutris runs
    # Proton through umu, which in Lutris' Flatpak starts the game in a sandbox of its own where
    # DISPLAY points to the desktop again instead of Gamescope (black Gamescope window, the game
    # beside it). install.sh uses GE-Proton11-12.
    version: wine-staging
    dxvk: false
    vkd3d: false
    overrides:
      ddraw: builtin
      dsound: builtin

  system:
    env:
      # gsfix.so (Gamescope only): keep clicks on the window frame away from the game, set the
      # window title and disable Proton's Gamescope hack that strips title bars from dialogs;
      # the app ID links the window to Lutris' menu entry (name and icon in the dock)
      LD_PRELOAD: $GAMEDIR/gsfix.so
      GSFIX_TITLE: Anstoss 2 Gold
      GSFIX_APPID: net.lutris.anstoss-2-gold-edition-[0-9]*
      GSFIX_WMNAME: gamescope
    # Gamescope scales the game up (in Lutris' Flatpak with the extension
    # org.freedesktop.Platform.VulkanLayer.gamescope, where it is called gamescope-brokey, which
    # gsfix.so knows); Lutris leaves it out where it is missing
    gamescope: true
    gamescope_game_res: 640x480
    gamescope_output_res: 1280x960
    gamescope_window_mode: ""
    gamescope_flags: "-S fit -F pixel"

  installer:
    - extract:
        file: a2gsrc
        dst: $CACHE/a2g

    # The GOG installer, unpacked by Lutris with its innoextract instead of being run;
    # src/a2patcher.exe takes the game from it
    - extract:
        file: goginstaller
        dst: $CACHE/gog
        format: gog

    - task:
        name: create_prefix
        prefix: $GAMEDIR

    # gsfix.so next to the game
    - merge:
        src: $CACHE/a2g/src/gsfix.so
        dst: $GAMEDIR

    # 96 DPI, no font smoothing
    - task:
        name: set_regedit
        prefix: $GAMEDIR
        path: HKEY_CURRENT_USER\Control Panel\Desktop
        key: LogPixels
        value: "00000060"
        type: REG_DWORD
    - task:
        name: set_regedit
        prefix: $GAMEDIR
        path: HKEY_CURRENT_USER\Control Panel\Desktop
        key: FontSmoothing
        value: "0"
        type: REG_SZ

    # Title bars in the colors of the XP theme Royale Noir (white on slate blue, inactive gray blue)
    - task:
        name: set_regedit
        prefix: $GAMEDIR
        path: HKEY_CURRENT_USER\Control Panel\Colors
        key: ActiveTitle
        value: "41 56 74"
        type: REG_SZ
    - task:
        name: set_regedit
        prefix: $GAMEDIR
        path: HKEY_CURRENT_USER\Control Panel\Colors
        key: GradientActiveTitle
        value: "58 70 86"
        type: REG_SZ
    - task:
        name: set_regedit
        prefix: $GAMEDIR
        path: HKEY_CURRENT_USER\Control Panel\Colors
        key: TitleText
        value: "255 255 255"
        type: REG_SZ
    - task:
        name: set_regedit
        prefix: $GAMEDIR
        path: HKEY_CURRENT_USER\Control Panel\Colors
        key: InactiveTitle
        value: "86 94 106"
        type: REG_SZ
    - task:
        name: set_regedit
        prefix: $GAMEDIR
        path: HKEY_CURRENT_USER\Control Panel\Colors
        key: GradientInactiveTitle
        value: "106 114 126"
        type: REG_SZ
    - task:
        name: set_regedit
        prefix: $GAMEDIR
        path: HKEY_CURRENT_USER\Control Panel\Colors
        key: InactiveTitleText
        value: "196 200 208"
        type: REG_SZ

    # Background of the virtual desktop in the active title bar color
    - task:
        name: set_regedit
        prefix: $GAMEDIR
        path: HKEY_CURRENT_USER\Control Panel\Colors
        key: Background
        value: "41 56 74"
        type: REG_SZ

    # Bold title bar font as in Royale Noir (LOGFONTW: Tahoma, height 10, weight 700)
    - task:
        name: set_regedit
        prefix: $GAMEDIR
        path: HKEY_CURRENT_USER\Control Panel\Desktop\WindowMetrics
        key: CaptionFont
        value: "0a 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 bc 02 00 00 00 00 00 01 00 00 00 00 54 00 61 00 68 00 6f 00 6d 00 61 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00"
        type: REG_BINARY

    # DirectDraw via GDI instead of OpenGL (video windows get painted over otherwise)
    - task:
        name: set_regedit
        prefix: $GAMEDIR
        path: HKEY_CURRENT_USER\Software\Wine\Direct3D
        key: renderer
        value: gdi
        type: REG_SZ

    # Without this, the game stops reacting to input after another window is clicked
    - task:
        name: set_regedit
        prefix: $GAMEDIR
        path: HKEY_CURRENT_USER\Software\Wine\X11 Driver
        key: UseTakeFocus
        value: "N"
        type: REG_SZ

    # Title bars as high as under Windows 98 (18, Wine's default is 25): the game sizes its windows
    # for that, the draw of the cup rounds otherwise reaches below the 480 lines of the screen and Wine
    # drops each of its pictures (the video stands still)
    - task:
        name: set_regedit
        prefix: $GAMEDIR
        path: HKEY_CURRENT_USER\Control Panel\Desktop\WindowMetrics
        key: CaptionHeight
        value: "18"
        type: REG_SZ

    # The videos are MS Video 1 under its other code CRAM, which Wine only knows as MSVC: the game
    # asks for CRAM and plays the draw of the cup rounds only if it finds it (32-bit view as well)
    - task:
        name: set_regedit
        prefix: $GAMEDIR
        path: HKEY_LOCAL_MACHINE\Software\Microsoft\Windows NT\CurrentVersion\Drivers32
        key: vidc.cram
        value: msvidc32.dll
        type: REG_SZ
    - task:
        name: set_regedit
        prefix: $GAMEDIR
        path: HKEY_LOCAL_MACHINE\Software\Wow6432Node\Microsoft\Windows NT\CurrentVersion\Drivers32
        key: vidc.cram
        value: msvidc32.dll
        type: REG_SZ

    # What the GOG installer writes to the registry; the game reads its folder from InstalledTo
    # (32-bit program, hence Wow6432Node)
    - task:
        name: set_regedit
        prefix: $GAMEDIR
        path: HKEY_LOCAL_MACHINE\Software\Wow6432Node\ASCARON\ANSTOSS 2\1.00
        key: InstalledTo
        value: 'C:\\Spiele\\Anstoss 2 Gold'
        type: REG_SZ
    - task:
        name: set_regedit
        prefix: $GAMEDIR
        path: HKEY_LOCAL_MACHINE\Software\Wow6432Node\ASCARON\ANSTOSS 2\1.00
        key: InstalledFrom
        value: 'C:\\Spiele\\Anstoss 2 Gold'
        type: REG_SZ
    - task:
        name: set_regedit
        prefix: $GAMEDIR
        path: HKEY_LOCAL_MACHINE\Software\Wow6432Node\ASCARON\ANSTOSS 2\1.00
        key: Language
        value: DEU
        type: REG_SZ

    # The questions, all before the work starts. Optional balancing patches from A2G-Patch, one page
    # each (see README)
    - input_menu:
        description: 'Verhandlungssperre monatlich abbauen? Nach drei Verhandlungsterminen mit Spielern eines Vereins gibt dieser keine Spieler mehr ab. Das Spiel will diese Sperre jeden Monat halbieren, erwischt wegen eines Fehlers aber die falschen Bytes, sodass sie bis zur nächsten Saison hält. Der Patch lässt sie wie vorgesehen abbauen.'
        id: NEGOTIATION
        options:
          - 'no': Original beibehalten
          - 'yes': Sperre monatlich abbauen
        preselect: 'no'

    - input_menu:
        description: 'Torgrenzen aufheben? Ohne Patch trifft eine Mannschaft vor der Halbzeit höchstens 6-mal und danach höchstens 10-mal, ab 7 Toren halbieren sich ihre Chancen. Der Patch hebt die Grenze auf 15 an.'
        id: GOALS
        options:
          - 'no': Original beibehalten
          - 'yes': Torgrenzen aufheben
        preselect: 'no'

    - input_menu:
        description: 'Unpassende Ansprachen bestrafen? Laut Spielhilfe kehrt sich die Wirkung einer Ansprache in der Mannschaftssitzung ins Negative um, wenn sie nicht zur Lage passt. Im Original zeigt das Spiel nur eine Meldung an. Mit dem Patch zieht eine unpassende Ansprache ihre Prozente für dieses Spiel von Abwehr und Angriff ab.'
        id: SPEECHES
        options:
          - 'no': Original beibehalten
          - 'yes': Unpassende Ansprachen bestrafen
        preselect: 'no'

    - input_menu:
        description: 'Trainer-Nachwuchs verbessern? Im Original werden die Co- und Torwarttrainer, die die Vereine einstellen können, über die Jahre immer schwächer, bis kaum noch gute übrig sind. Mit dem Patch kommen immer wieder starke Trainer nach, darunter auch ehemalige Spieler.'
        id: COACHES
        options:
          - 'no': Original beibehalten
          - 'yes': Trainer-Nachwuchs verbessern
        preselect: 'no'

    # Texts from A2G-Patch in RESDLL.dll, the event texts and the tips (src/a2texts.py, see README); the
    # typing errors are fixed every time
    - input_menu:
        description: 'Beträge in Euro statt DM anzeigen? Alle Beträge im Spiel, in Dialogen, Ereignissen und Tipps erscheinen dann mit € statt DM. Die Zahlen bleiben gleich: 1 DM wird zu 1 €. „DM“ als Abkürzung des defensiven Mittelfelds bleibt.'
        id: EURO
        options:
          - 'no': Original beibehalten
          - 'yes': Euro statt DM
        preselect: 'no'

    - input_menu:
        description: 'Innenverteidiger (IV) statt Manndecker (MD)? Die Position heißt dann in Listen, Suchdialogen, der Nationalmannschaft und den Meldungen des Spiels Innenverteidiger.'
        id: CENTREBACK
        options:
          - 'no': Original beibehalten
          - 'yes': Innenverteidiger
        preselect: 'no'

    - input_menu:
        description: 'Heutige Namen für Wettbewerbe, Ligen und Gruppen? UEFA-Cup, Cup der Pokalsieger, Weltcup und ECL-Cup statt UEFA-Pokal, Pokal der Pokalsieger, Weltpokal und UI-Cup; 1. und 2. Bundesliga, Regionalliga West, Championship, League One, Ligue 1 und 2; Gruppen A bis H statt 1 bis 8.'
        id: NAMES
        options:
          - 'no': Original beibehalten
          - 'yes': Heutige Namen
        preselect: 'no'

    # The manager course quiz from A2G-Patch (src/a2quiz.py, see README): answers of today, 150 new
    # questions, both or neither
    - input_menu:
        description: 'Quiz der Managerfortbildung auffrischen? Mit heutigen Antworten sind 77 Fragen auf dem Stand von 2026: Meistertitel, Rekorde und Regeln von heute, Fragen zu Ämtern und Personen von damals nennen ihr Jahr, und vier Antworten, die schon 1998 falsch waren, sind berichtigt. Dazu oder statt dessen kommen 150 neue Fragen von der WM 1998 bis zur WM 2026.'
        id: QUIZ
        options:
          - original: Original beibehalten
          - answers: Antworten auf heutigen Stand bringen
          - both: Heutige Antworten und 150 neue Fragen
          - new: Originalfragen und 150 neue Fragen
        preselect: original

    # Everything else in one Windows program in the prefix (src/a2patcher.py, built by the release
    # workflow): takes the game from the unpacked GOG installer, then a2start.exe, the bug fixes, the
    # videos, the data and the texts; with the answers above
    - task:
        name: wineexec
        prefix: $GAMEDIR
        executable: $CACHE/a2g/src/a2patcher.exe
        args: 'gog "$CACHE/gog" --negotiation $INPUT_NEGOTIATION --goals $INPUT_GOALS --speeches $INPUT_SPEECHES --coaches $INPUT_COACHES --euro $INPUT_EURO --centreback $INPUT_CENTREBACK --names $INPUT_NAMES --quiz $INPUT_QUIZ'
