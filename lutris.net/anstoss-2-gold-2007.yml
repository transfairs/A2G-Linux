# SPDX-License-Identifier: GPL-3.0-only
# Lutris installer for lutris.net: Anstoss 2 Gold of 2007 from the DVD "ANSTOSS 2007" by Kalypso
# (Inno Setup installer ANSTOSS_2_GOLD/Setup.exe, or an ISO image of the DVD).
# Unlike anstoss2.yml.in it needs no install.sh run before: it downloads this repository itself.
# On lutris.net, the script is everything below "script:", one indentation level less (lutris.net/content.sh).
#
# The URL below always loads the newest release (asset A2G-Linux.tar.gz, published by .github/workflows/release.yml for each tag v*).
name: Anstoss 2 Gold (2007)
# The game page on lutris.net, the same as for the CD and GOG scripts
game_slug: anstoss-2-gold-edition
slug: anstoss-2-gold-cd-2007
version: CD 2007
runner: wine

script:
  # Lutris checks these before the installation starts. The steps with disable_runtime use the
  # system's programs, so Lutris must be a distribution package, not the Flatpak.
  require-binaries: python3, ffmpeg, ffprobe, gamescope, glib-compile-schemas, zenity, magick | convert

  files:
    # This repository (helper programs, patches, font builder), the newest release
    - a2gsrc:
        url: https://github.com/transfairs/A2G-Linux/releases/latest/download/A2G-Linux.tar.gz
        filename: a2g-linux.tar.gz

  game:
    # 640x480 Wine virtual desktop (Proton ignores the registry setting for it), inside it
    # a2start.exe: switches to 640x480x16 and patches the game in memory (see README)
    exe: $GAMEDIR/drive_c/windows/explorer.exe
    working_dir: $GAMEDIR/drive_c/Spiele/Anstoss 2 Gold
    args: /desktop=A2,640x480 "C:/Spiele/Anstoss 2 Gold/a2start.exe" run.exe /f
    prefix: $GAMEDIR

  wine:
    # No version: Lutris then uses its default "GE-Proton (Latest)" (newest GE-Proton via umu);
    # install.sh pins GE-Proton11-12 instead. "version: ge-proton" fails in Lutris 0.5.22: installer
    # scripts get "-x86_64" appended (only names starting with "GE-Proton" are exempt), and
    # "ge-proton-x86_64" can be neither found nor downloaded.
    dxvk: false
    vkd3d: false
    overrides:
      ddraw: builtin
      dsound: builtin

  system:
    env:
      # GNOME 50: GTK3 inside Gamescope crashes (key "antialiasing" missing), hence a patched schema copy
      GSETTINGS_SCHEMA_DIR: $GAMEDIR/gschemas
      # gsfix.so (Gamescope only): keep clicks on the window frame away from the game, set the
      # window title and disable Proton's Gamescope hack that strips title bars from dialogs;
      # the app ID links the window to Lutris' menu entry (name and icon in the dock)
      LD_PRELOAD: $GAMEDIR/gsfix.so
      GSFIX_TITLE: Anstoss 2 Gold
      GSFIX_APPID: net.lutris.anstoss-2-gold-edition-[0-9]*
      GSFIX_WMNAME: gamescope
    gamescope: true
    gamescope_game_res: 640x480
    gamescope_output_res: 1280x960
    gamescope_window_mode: ""
    gamescope_flags: "-S fit -F pixel"

  installer:
    # Shell variables in commands are lowercase: Lutris replaces $GAMEDIR, $CACHE, $DISC, $HOME,
    # $a2gsrc etc. itself, also as the start of a longer name.
    - extract:
        file: a2gsrc
        dst: $CACHE/a2g
    # GitHub's archive has one top folder; Lutris usually unpacks its contents, this also covers the other case
    - execute:
        command: 'cd "$CACHE/a2g" && if [ ! -f install.sh ]; then d=$(dirname "$(find . -maxdepth 2 -name install.sh | head -1)") && cp -r "$d"/. . ; fi && test -f install.sh && test -f src/a2start.exe && test -f src/gsfix.so || { echo "The archive does not contain install.sh, src/a2start.exe and src/gsfix.so"; exit 1; }'

    # Lutris matches the case of the path itself; the DVD is read in place, nothing is copied
    - insert-disc:
        requires: ANSTOSS_2_GOLD/Setup.exe
        message: 'Bitte die DVD "ANSTOSS 2007" einlegen oder ihr ISO-Abbild einbinden (Doppelklick im Dateimanager oder "udisksctl loop-setup -f anstoss2007.iso"), dann das Laufwerk suchen lassen oder den Ordner der DVD auswählen.'

    - task:
        name: create_prefix
        prefix: $GAMEDIR

    # gschemas and gsfix.so (built by the release workflow) next to the game
    - execute:
        command: 'bash "$CACHE/a2g/install.sh" --make-schemas "$GAMEDIR/gschemas"'
        disable_runtime: true  # glib-compile-schemas with the system's libraries
    - execute:
        command: 'cp "$CACHE/a2g/src/gsfix.so" "$GAMEDIR/gsfix.so"'

    # 96 DPI, no font smoothing
    - task:
        name: set_regedit
        prefix: $GAMEDIR
        path: HKEY_CURRENT_USER\Control Panel\Desktop
        key: LogPixels
        value: "00000060"
        type: REG_DWORD
    - task:
        name: set_regedit
        prefix: $GAMEDIR
        path: HKEY_CURRENT_USER\Control Panel\Desktop
        key: FontSmoothing
        value: "0"
        type: REG_SZ

    # Title bars in the colors of the XP theme Royale Noir (white on slate blue, inactive gray blue)
    - task:
        name: set_regedit
        prefix: $GAMEDIR
        path: HKEY_CURRENT_USER\Control Panel\Colors
        key: ActiveTitle
        value: "41 56 74"
        type: REG_SZ
    - task:
        name: set_regedit
        prefix: $GAMEDIR
        path: HKEY_CURRENT_USER\Control Panel\Colors
        key: GradientActiveTitle
        value: "58 70 86"
        type: REG_SZ
    - task:
        name: set_regedit
        prefix: $GAMEDIR
        path: HKEY_CURRENT_USER\Control Panel\Colors
        key: TitleText
        value: "255 255 255"
        type: REG_SZ
    - task:
        name: set_regedit
        prefix: $GAMEDIR
        path: HKEY_CURRENT_USER\Control Panel\Colors
        key: InactiveTitle
        value: "86 94 106"
        type: REG_SZ
    - task:
        name: set_regedit
        prefix: $GAMEDIR
        path: HKEY_CURRENT_USER\Control Panel\Colors
        key: GradientInactiveTitle
        value: "106 114 126"
        type: REG_SZ
    - task:
        name: set_regedit
        prefix: $GAMEDIR
        path: HKEY_CURRENT_USER\Control Panel\Colors
        key: InactiveTitleText
        value: "196 200 208"
        type: REG_SZ
    # Background of the virtual desktop in the active title bar color
    - task:
        name: set_regedit
        prefix: $GAMEDIR
        path: HKEY_CURRENT_USER\Control Panel\Colors
        key: Background
        value: "41 56 74"
        type: REG_SZ
    # On it, centred, the icon from A2G-Icon or the one picked (the question ICON below; src/a2assets.py
    # writes a2desktop.bmp only for those, not for the game's own icon; without the file Wine shows
    # the plain color)
    - task:
        name: set_regedit
        prefix: $GAMEDIR
        path: HKEY_CURRENT_USER\Control Panel\Desktop
        key: Wallpaper
        value: 'C:\\Spiele\\Anstoss 2 Gold\\a2desktop.bmp'
        type: REG_SZ
    - task:
        name: set_regedit
        prefix: $GAMEDIR
        path: HKEY_CURRENT_USER\Control Panel\Desktop
        key: TileWallpaper
        value: "0"
        type: REG_SZ

    # Bold title bar font as in Royale Noir (LOGFONTW: Tahoma, height 10, weight 700)
    - task:
        name: set_regedit
        prefix: $GAMEDIR
        path: HKEY_CURRENT_USER\Control Panel\Desktop\WindowMetrics
        key: CaptionFont
        value: "0a 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 bc 02 00 00 00 00 00 01 00 00 00 00 54 00 61 00 68 00 6f 00 6d 00 61 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00"
        type: REG_BINARY

    # DirectDraw via GDI instead of OpenGL (video windows get painted over otherwise)
    - task:
        name: set_regedit
        prefix: $GAMEDIR
        path: HKEY_CURRENT_USER\Software\Wine\Direct3D
        key: renderer
        value: gdi
        type: REG_SZ

    # Without this, the game stops reacting to input after another window is clicked
    - task:
        name: set_regedit
        prefix: $GAMEDIR
        path: HKEY_CURRENT_USER\Software\Wine\X11 Driver
        key: UseTakeFocus
        value: "N"
        type: REG_SZ

    # ANSTOSS_2_GOLD/Setup.exe (Inno Setup) on the DVD, unpacked with innoextract instead of running
    # it. Its files go to C:\Spiele\Anstoss 2 Gold as Kalypso's setup installs them, with the folder
    # CD (the CD's ARCHIVES, SOUNDS and VIDEOS), which becomes drive D: (below). The launcher
    # anstoss2.exe and its compatibility.dll stay unused. run.exe is taken out of its PECRYPT32
    # shell (src/a2unpack.py; original kept as run.exe.vor-entpacken).
    # Lutris' own innoextract (static build) first, then the system's.
    - execute:
        command: 'inno=$(ls "${XDG_DATA_HOME:-$HOME/.local/share}"/lutris/runtime/innoextract*/innoextract 2>/dev/null | head -1); inno=${inno:-$(command -v innoextract)}; test -n "$inno" || { echo "innoextract is missing, please install it with your package manager"; exit 1; }; setup=$(find "$DISC" -maxdepth 2 -ipath "*/anstoss_2_gold/setup.exe" | head -1) && test -n "$setup" && "$inno" -q -l "$setup" | grep -i "\"app/run.exe\"" >/dev/null && "$inno" -q -l "$setup" | grep -i "\"app/CD/ARCHIVES/COMMENTS.CPR\"" >/dev/null && s="$GAMEDIR/drive_c/Spiele" && mkdir -p "$s" && rm -rf "$s/a2inno" && "$inno" -s -m -d "$s/a2inno" "$setup" && mv "$s/a2inno/app" "$s/Anstoss 2 Gold" && rm -rf "$s/a2inno" && test -d "$s/Anstoss 2 Gold/CD" && python3 "$CACHE/a2g/src/a2unpack.py" "$s/Anstoss 2 Gold/run.exe" || { echo "Unpacking ANSTOSS_2_GOLD/Setup.exe from the DVD failed"; exit 1; }'
        disable_runtime: true  # a system innoextract needs the system's libraries

    # Banner and cover from the box art that CD/AUTORUN.EXE shows, as install.sh does (the icon follows
    # with the question ICON): lutris.net has no icon for anstoss-2-gold-edition, and its banner and
    # cover show other art. Lutris names these files after the game slug and downloads only missing
    # ones, so it keeps them.
    - execute:
        command: 'd="${XDG_DATA_HOME:-$HOME/.local/share}" && g="$GAMEDIR/drive_c/Spiele/Anstoss 2 Gold" && python3 "$CACHE/a2g/src/a2assets.py" media "$g/CD" "$d/lutris/banners/anstoss-2-gold-edition.jpg" "$d/lutris/coverart/anstoss-2-gold-edition.jpg" || { echo "Banner and cover could not be created"; exit 1; }'
        disable_runtime: true  # ImageMagick with the system's libraries

    # The folder CD as CD-ROM drive D:, as Kalypso's compatibility.dll fakes it. If the DVD or ISO
    # was mounted while the prefix was created, Wine has taken D: for it (d: and the device link
    # d::); without removing d::, Wine points D: back to the DVD on the next start.
    - execute:
        command: 'rm -f "$GAMEDIR/dosdevices/d:" "$GAMEDIR/dosdevices/d::" && ln -s "$GAMEDIR/drive_c/Spiele/Anstoss 2 Gold/CD" "$GAMEDIR/dosdevices/d:"'
    - task:
        name: set_regedit
        prefix: $GAMEDIR
        path: HKEY_LOCAL_MACHINE\Software\Wine\Drives
        key: "d:"
        value: cdrom
        type: REG_SZ

    # What the 1999 setup writes to the registry; the game reads its folder from InstalledTo
    # (32-bit program, hence Wow6432Node)
    - task:
        name: set_regedit
        prefix: $GAMEDIR
        path: HKEY_LOCAL_MACHINE\Software\Wow6432Node\ASCARON\ANSTOSS 2\1.00
        key: InstalledTo
        value: 'C:\\Spiele\\Anstoss 2 Gold'
        type: REG_SZ
    - task:
        name: set_regedit
        prefix: $GAMEDIR
        path: HKEY_LOCAL_MACHINE\Software\Wow6432Node\ASCARON\ANSTOSS 2\1.00
        key: InstalledFrom
        value: 'D:\\'
        type: REG_SZ
    - task:
        name: set_regedit
        prefix: $GAMEDIR
        path: HKEY_LOCAL_MACHINE\Software\Wow6432Node\ASCARON\ANSTOSS 2\1.00
        key: Language
        value: DEU
        type: REG_SZ

    - execute:
        command: 'cp "$CACHE/a2g/src/a2start.exe" "$GAMEDIR/drive_c/Spiele/Anstoss 2 Gold/"'

    # Bug fixes from A2G-Patch (--fixes, see README): sound on the default audio device, arrow buttons that
    # keep counting, undecodable videos skipped, no freeze after 24.9 days of uptime, no false disk space
    # warning, squads limited to 30 players, investment growth kept off the bank balance, the club's money
    # stopping at 2 billion DM instead of running over, random events that do what their message says,
    # no crash on events without a fitting player, trainers and managers in weak countries improving
    # yearly, appearances without a mark kept out of the average, a list of the most appearances that
    # takes new players after 50; and, although A2G-Patch counts them as balancing, fish poisoning that
    # keeps a player out for the three weeks its message says, all events around the manager's private
    # life (--fish, --manager) and interview answers that take effect
    # (--interviews, a balancing patch in A2G-Patch, applied every time); let the CD checks pass
    # (--disc-check; a copy of the CD gives another signature) and add the program changes of patch 1.01
    # (--v101, src/a2v101.S), see README
    - execute:
        command: 'python3 "$CACHE/a2g/src/a2patch.py" --fixes --interviews --disc-check --v101 "$GAMEDIR/drive_c/Spiele/Anstoss 2 Gold/run.exe"'
        disable_runtime: true

    # Indeo videos in the game folder (the 5 in CD/VIDEOS)
    - execute:
        command: 'bash "$CACHE/a2g/install.sh" --convert-only "$GAMEDIR/drive_c/Spiele/Anstoss 2 Gold"'
        disable_runtime: true  # ffmpeg/ffprobe do not start with Lutris' runtime libraries

    # Data of patch 1.01: event texts, LAENDER.SAV, MoveList.dat (src/a2data101.py, src/a2movelist.py)
    - execute:
        command: 'python3 "$CACHE/a2g/src/a2data101.py" "$GAMEDIR/drive_c/Spiele/Anstoss 2 Gold"'
        disable_runtime: true

    # Icon for Lutris, the dock and the application menu (src/a2assets.py). If A2G-Icon can't be
    # fetched or no usable file is picked, the game's own icon is used.
    - input_menu:
        description: 'Welches Icon soll das Spiel in Lutris, im Dock und im Anwendungsmenü bekommen? Das Icon des Spiels hat nur 32×32 Pixel und 16 Farben und wirkt vergrößert pixelig. A2G-Icon ist eine Neuzeichnung davon. Ein neu gezeichnetes oder eigenes Icon erscheint auch in der Mitte des Spielhintergrunds.'
        id: ICON
        options:
          - game: Icon des Spiels
          - repo: Neu gezeichnetes Icon von A2G-Icon herunterladen
          - file: Eigene Dateien wählen (PNG und/oder SVG)
        preselect: game
    - execute:
        command: 'ico=$(find "$GAMEDIR/drive_c/Spiele/Anstoss 2 Gold" -maxdepth 1 -iname anstoss2.ico | head -1) && test -n "$ico" && d="${XDG_DATA_HOME:-$HOME/.local/share}" && python3 "$CACHE/a2g/src/a2assets.py" icon "$INPUT_ICON" "$ico" "$d/icons/hicolor" lutris_anstoss-2-gold-edition "$GAMEDIR/drive_c/Spiele/Anstoss 2 Gold/a2desktop.bmp" || { echo "The icon could not be installed"; exit 1; }'
        disable_runtime: true  # ImageMagick and zenity with the system's libraries

    # Optional: data set (overwrites the game's files) and save games (existing ones are kept)
    - input_menu:
        description: 'Einen Anstoss-2-Datensatz in den Spielordner importieren?'
        id: DATASET
        options:
          - none: Nicht importieren
          - zip: Aus einer Zip-Datei
          - dir: Aus einem Ordner
        preselect: none
    - execute:
        command: 'python3 "$CACHE/a2g/src/a2import.py" --overwrite --title "Anstoss-2-Datensatz" "$INPUT_DATASET" "$GAMEDIR/drive_c/Spiele/Anstoss 2 Gold"'
        disable_runtime: true  # zenity does not start with Lutris' runtime libraries

    - input_menu:
        description: 'Spielstände in den Spielordner importieren?'
        id: SAVES
        options:
          - none: Nicht importieren
          - dir: Aus einem Ordner
          - zip: Aus einer Zip-Datei
        preselect: none
    - execute:
        command: 'python3 "$CACHE/a2g/src/a2import.py" --title "Anstoss-2-Spielstände" "$INPUT_SAVES" "$GAMEDIR/drive_c/Spiele/Anstoss 2 Gold"'
        disable_runtime: true  # zenity does not start with Lutris' runtime libraries

    # Optional balancing patches from A2G-Patch, one page each (see README)
    - input_menu:
        description: 'Verhandlungssperre monatlich abbauen? Nach drei Verhandlungsterminen mit Spielern eines Vereins gibt dieser keine Spieler mehr ab. Das Spiel will diese Sperre jeden Monat halbieren, erwischt wegen eines Fehlers aber die falschen Bytes, sodass sie bis zur nächsten Saison hält. Der Patch lässt sie wie vorgesehen abbauen.'
        id: NEGOTIATION
        options:
          - 'no': Original beibehalten
          - 'yes': Sperre monatlich abbauen
        preselect: 'no'
    - execute:
        command: 'test "$INPUT_NEGOTIATION" != yes || python3 "$CACHE/a2g/src/a2patch.py" --negotiation "$GAMEDIR/drive_c/Spiele/Anstoss 2 Gold/run.exe"'
        disable_runtime: true

    - input_menu:
        description: 'Torgrenzen aufheben? Ohne Patch trifft eine Mannschaft vor der Halbzeit höchstens 6-mal und danach höchstens 10-mal, ab 7 Toren halbieren sich ihre Chancen. Der Patch hebt die Grenze auf 15 an.'
        id: GOALS
        options:
          - 'no': Original beibehalten
          - 'yes': Torgrenzen aufheben
        preselect: 'no'
    - execute:
        command: 'test "$INPUT_GOALS" != yes || python3 "$CACHE/a2g/src/a2patch.py" --goals "$GAMEDIR/drive_c/Spiele/Anstoss 2 Gold/run.exe"'
        disable_runtime: true

    - input_menu:
        description: 'Unpassende Ansprachen bestrafen? Laut Spielhilfe kehrt sich die Wirkung einer Ansprache in der Mannschaftssitzung ins Negative um, wenn sie nicht zur Lage passt. Im Original zeigt das Spiel nur eine Meldung an. Mit dem Patch zieht eine unpassende Ansprache ihre Prozente für dieses Spiel von Abwehr und Angriff ab.'
        id: SPEECHES
        options:
          - 'no': Original beibehalten
          - 'yes': Unpassende Ansprachen bestrafen
        preselect: 'no'
    - execute:
        command: 'test "$INPUT_SPEECHES" != yes || python3 "$CACHE/a2g/src/a2patch.py" --speeches "$GAMEDIR/drive_c/Spiele/Anstoss 2 Gold/run.exe"'
        disable_runtime: true

    - input_menu:
        description: 'Trainer-Nachwuchs verbessern? Im Original werden die Co- und Torwarttrainer, die die Vereine einstellen können, über die Jahre immer schwächer, bis kaum noch gute übrig sind. Mit dem Patch kommen immer wieder starke Trainer nach, darunter auch ehemalige Spieler.'
        id: COACHES
        options:
          - 'no': Original beibehalten
          - 'yes': Trainer-Nachwuchs verbessern
        preselect: 'no'
    - execute:
        command: 'test "$INPUT_COACHES" != yes || python3 "$CACHE/a2g/src/a2patch.py" --coaches "$GAMEDIR/drive_c/Spiele/Anstoss 2 Gold/run.exe"'
        disable_runtime: true

    # Texts from A2G-Patch in RESDLL.dll, the event texts and the tips (src/a2texts.py, see README), after
    # the data set, which may bring files of its own, and after patch 1.01's data and the dialog styles:
    # typing errors (--typos, a bug fix in A2G-Patch) every time, then optionally one page each
    - execute:
        command: 'python3 "$CACHE/a2g/src/a2texts.py" --typos "$GAMEDIR/drive_c/Spiele/Anstoss 2 Gold"'
        disable_runtime: true

    - input_menu:
        description: 'Beträge in Euro statt DM anzeigen? Alle Beträge im Spiel, in Dialogen, Ereignissen und Tipps erscheinen dann mit € statt DM. Die Zahlen bleiben gleich: 1 DM wird zu 1 €. „DM“ als Abkürzung des defensiven Mittelfelds bleibt.'
        id: EURO
        options:
          - 'no': Original beibehalten
          - 'yes': Euro statt DM
        preselect: 'no'
    - execute:
        command: 'test "$INPUT_EURO" != yes || python3 "$CACHE/a2g/src/a2texts.py" --euro "$GAMEDIR/drive_c/Spiele/Anstoss 2 Gold"'
        disable_runtime: true

    - input_menu:
        description: 'Innenverteidiger (IV) statt Manndecker (MD)? Die Position heißt dann in Listen, Suchdialogen, der Nationalmannschaft und den Meldungen des Spiels Innenverteidiger.'
        id: CENTREBACK
        options:
          - 'no': Original beibehalten
          - 'yes': Innenverteidiger
        preselect: 'no'
    - execute:
        command: 'test "$INPUT_CENTREBACK" != yes || python3 "$CACHE/a2g/src/a2texts.py" --centre-back "$GAMEDIR/drive_c/Spiele/Anstoss 2 Gold"'
        disable_runtime: true

    - input_menu:
        description: 'Heutige Namen für Wettbewerbe, Ligen und Gruppen? UEFA-Cup, Cup der Pokalsieger, Weltcup und ECL-Cup statt UEFA-Pokal, Pokal der Pokalsieger, Weltpokal und UI-Cup; 1. und 2. Bundesliga, Regionalliga West, Championship, League One, Ligue 1 und 2; Gruppen A bis H statt 1 bis 8.'
        id: NAMES
        options:
          - 'no': Original beibehalten
          - 'yes': Heutige Namen
        preselect: 'no'
    - execute:
        command: 'test "$INPUT_NAMES" != yes || python3 "$CACHE/a2g/src/a2texts.py" --cups --leagues --groups "$GAMEDIR/drive_c/Spiele/Anstoss 2 Gold"'
        disable_runtime: true

    # Optional: the manager course quiz from A2G-Patch (src/a2quiz.py, see README): answers of today,
    # 150 new questions, both or neither
    - input_menu:
        description: 'Quiz der Managerfortbildung auffrischen? Mit heutigen Antworten sind 77 Fragen auf dem Stand von 2026: Meistertitel, Rekorde und Regeln von heute, Fragen zu Ämtern und Personen von damals nennen ihr Jahr, und vier Antworten, die schon 1998 falsch waren, sind berichtigt. Dazu oder statt dessen kommen 150 neue Fragen von der WM 1998 bis zur WM 2026.'
        id: QUIZ
        options:
          - original: Original beibehalten
          - answers: Antworten auf heutigen Stand bringen
          - both: Heutige Antworten und 150 neue Fragen
          - new: Originalfragen und 150 neue Fragen
        preselect: original
    - execute:
        command: 'test "$INPUT_QUIZ" = original || python3 "$CACHE/a2g/src/a2quiz.py" "$INPUT_QUIZ" "$GAMEDIR/drive_c/Spiele/Anstoss 2 Gold"'
        disable_runtime: true

    # Editor and, optionally, A2G-Trainer: entries in the application menu, started in this prefix
    # (src/a2run.sh). Not a Lutris file, since those cannot be optional. Own slug anstoss-2-2007 for their
    # files, so they never replace the entries of an install.sh installation (anstoss-2-gold-2007).
    - input_menu:
        description: 'A2G-Trainer installieren? Er bearbeitet das laufende Spiel (Spieler, Vereine, Finanzen) und bekommt einen eigenen Eintrag im Anwendungsmenü.'
        id: TRAINER
        options:
          - none: Nicht installieren
          - download: Neueste Version von GitHub herunterladen
          - file: Aus einer lokalen Datei (zip oder exe)
        preselect: none
    - execute:
        command: 'python3 "$CACHE/a2g/src/a2extras.py" --slug anstoss-2-2007 "$GAMEDIR" "$INPUT_TRAINER"'
        disable_runtime: true  # system tools (ImageMagick) with the system's libraries
