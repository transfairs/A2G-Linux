[tox]
envlist = py3{12,13,14},lint,bandit,coverage,build
skip_missing_interpreters = True
skipsdist = True

[testenv]
deps =
    -rrequirements-dev.txt
# the real game files for tests/test_real_exes.py (skipped without them), see .github/pre-release.sh
passenv = A2G_*
commands =
    python -m pytest {posargs}

[testenv:coverage]
commands =
    python -m coverage erase
    python -m coverage run -m pytest
    python -m coverage html -d logs/coverage
    python -m coverage report

[testenv:lint]
commands =
    isort --check-only --diff src tests
    black --check --diff src tests .github/editor-icon.py
    flake8 src tests .github/editor-icon.py
    shellcheck install.sh src/a2run.sh lutris.net/content.sh .github/build-gsfix.sh .github/build-ffmpeg.sh .github/build-mask.sh .github/build-patcher.sh .github/release-notes.sh .github/pre-release.sh

[testenv:bandit]
commands =
    bandit -c pyproject.toml -r src

# The Windows helpers (MinGW-w64), gsfix.so and gsdisplay.so, built with warnings as errors into a scratch folder,
# and src/a2mask.h checked against a fresh build of src/a2mask.S (GNU as); the checked-in src/*.exe are not touched (see "Building the helper programs" in README.md).
[testenv:build]
skip_install = True
deps =
allowlist_externals =
    x86_64-w64-mingw32-gcc
    gcc
    .github/build-mask.sh
    cmp
commands =
    .github/build-mask.sh {envtmpdir}/a2mask.h
    cmp src/a2mask.h {envtmpdir}/a2mask.h
    x86_64-w64-mingw32-gcc -O2 -Wall -Werror -mwindows -o {envtmpdir}/a2start.exe src/a2start.c -lgdi32
    x86_64-w64-mingw32-gcc -O2 -Wall -Werror -o {envtmpdir}/a2setup.exe src/a2setup.c
    gcc -O2 -Wall -Werror -shared -fPIC -o {envtmpdir}/gsfix.so src/gsfix.c -ldl
    gcc -O2 -Wall -Werror -shared -fPIC -o {envtmpdir}/gsdisplay.so src/gsdisplay.c

[flake8]
max-line-length = 120
extend-ignore = E203,E701,E704
exclude = .venv,.tox,__pycache__
