[tox]
envlist = py3{12,13,14},lint,bandit,coverage,build
skip_missing_interpreters = True
skipsdist = True

[testenv]
deps =
    -rrequirements-dev.txt
commands =
    python -m pytest {posargs}

[testenv:coverage]
commands =
    python -m coverage erase
    python -m coverage run -m pytest
    python -m coverage html -d logs/coverage
    python -m coverage report

[testenv:lint]
commands =
    isort --check-only --diff src tests
    black --check --diff src tests
    flake8 src tests
    shellcheck install.sh src/a2run.sh

[testenv:bandit]
commands =
    bandit -c pyproject.toml -r src

# The Windows helpers (MinGW-w64) and gsfix.so, built with warnings as errors into a scratch folder;
# the checked-in src/*.exe are not touched (see "Building the helper programs" in README.md).
[testenv:build]
skip_install = True
deps =
allowlist_externals =
    x86_64-w64-mingw32-gcc
    gcc
commands =
    x86_64-w64-mingw32-gcc -O2 -Wall -Werror -mwindows -o {envtmpdir}/a2start.exe src/a2start.c -lgdi32
    x86_64-w64-mingw32-gcc -O2 -Wall -Werror -o {envtmpdir}/a2setup.exe src/a2setup.c
    gcc -O2 -Wall -Werror -shared -fPIC -o {envtmpdir}/gsfix.so src/gsfix.c -ldl

[flake8]
max-line-length = 120
extend-ignore = E203,E701,E704
exclude = .venv,.tox,__pycache__
