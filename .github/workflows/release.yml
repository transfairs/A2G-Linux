name: Release

# Pushing a tag v* publishes a release with the repository attached as A2G-Linux.tar.gz. The
# lutris.net installer scripts download it from releases/latest/download/A2G-Linux.tar.gz, which
# always points to the asset of the newest release (GitHub's own source archives have no such
# "latest" URL).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build archive
        run: git archive --format=tar.gz --prefix=A2G-Linux/ -o A2G-Linux.tar.gz "$GITHUB_REF_NAME"

      # A release made by hand for this tag only gets the archive (replacing an older one)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" A2G-Linux.tar.gz --clobber
          else
            gh release create "$GITHUB_REF_NAME" A2G-Linux.tar.gz --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
