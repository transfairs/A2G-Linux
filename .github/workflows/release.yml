name: Release

# Pushing a tag v* publishes a release with the repository attached as A2G-Linux.tar.gz. The
# lutris.net installer scripts download it from releases/latest/download/A2G-Linux.tar.gz, which
# always points to the asset of the newest release (GitHub's own source archives have no such
# "latest" URL). The archive also holds programs built here, which the lutris.net scripts use:
# - src/gsfix.so, so they need neither gcc nor the Wayland headers. Built in an Ubuntu 22.04
#   container, so it runs with any glibc from 2.34 on (dlsym), not only with the newest one of the runner.
# - src/a2patcher.exe (PyInstaller, on Windows) and src/ffmpeg.exe (MinGW-w64), the Windows programs
#   that do the installation's work inside the Wine prefix, so the scripts also run in Lutris' Flatpak.
# All three and the archive get a signed build provenance (step "Attest build provenance").
#
# Before anything is published, the tests workflow runs for the tagged commit (all of tox), and the tag
# must lie on main. The release notes list the commit subjects since the previous tag
# (.github/release-notes.sh); .github/pre-release.sh shows them beforehand.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write      # build provenance (attestations) of the programs built here
  attestations: write

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  patcher:
    needs: tests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build a2patcher.exe
        shell: bash
        run: .github/build-patcher.sh

      - name: Keep a2patcher.exe for the release job
        uses: actions/upload-artifact@v4
        with:
          name: a2patcher
          path: src/a2patcher.exe

  release:
    needs: [tests, patcher]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # all tags and commits, for the release notes

      - name: Tag on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_REF_NAME is not on main"; exit 1; }

      - name: Release notes
        run: .github/release-notes.sh "$GITHUB_REF_NAME" > notes.md && cat notes.md

      - name: Build gsfix.so
        run: .github/build-gsfix.sh

      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Build ffmpeg.exe
        run: .github/build-ffmpeg.sh

      - name: Get a2patcher.exe
        uses: actions/download-artifact@v4
        with:
          name: a2patcher
          path: src

      - name: Build archive
        run: |
          mkdir out
          git archive --format=tar --prefix=A2G-Linux/ "$GITHUB_REF_NAME" | tar -x -C out
          cp src/gsfix.so src/a2patcher.exe src/ffmpeg.exe out/A2G-Linux/src/
          tar -czf A2G-Linux.tar.gz -C out A2G-Linux

      # Signed build provenance: anyone can check that these files were built by this workflow from
      # this repository at this tag ("gh attestation verify <file> --repo transfairs/A2G-Linux"), for
      # the lutris.net moderators in particular, since the scripts there run a2patcher.exe
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            src/a2patcher.exe
            src/ffmpeg.exe
            src/gsfix.so
            A2G-Linux.tar.gz

      # A release made by hand for this tag only gets the archive (replacing an older one), its notes stay
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" A2G-Linux.tar.gz --clobber
          else
            gh release create "$GITHUB_REF_NAME" A2G-Linux.tar.gz --verify-tag --notes-file notes.md --title "$GITHUB_REF_NAME"
          fi
