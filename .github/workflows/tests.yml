name: Tests

# Runs tox (tests, lint, bandit, coverage, build of the helper programs) on every push and pull
# request. The tests use synthetic data only; no files of the game are needed.
on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tox:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: |
            3.12
            3.13
            3.14

      # MinGW-w64 for a2start.exe and a2setup.exe, the Wayland headers for gsfix.so (tox env "build");
      # GNU binutils (as, ld) for the 1.01 code in src/a2v101.S come with the runner.
      - name: Install MinGW-w64 and Wayland headers
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 libwayland-dev

      - name: Install tox
        run: python -m pip install tox

      - name: Run tox
        run: tox

      # As in the release workflow, with the older headers and glibc of Ubuntu 22.04
      - name: Build gsfix.so for the release
        run: .github/build-gsfix.sh "$RUNNER_TEMP/gsfix.so"
